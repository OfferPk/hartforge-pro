<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="50" rx="8" fill="#0f172a"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="125" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600">HARTForge Pro v1.0.0 — Industrial HART-IP (IEC 62591) &amp; WirelessHART Protocol Studio</text>
  <rect x="1000" y="42" width="150" height="26" rx="4" fill="#f59e0b"/>
  <text x="1015" y="59" fill="#0b1120" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">WIRESHARK PCAP (5094)</text>

  <!-- Main Navigation Tabs -->
  <rect x="30" y="90" width="1140" height="45" fill="#080d14"/>
  <rect x="40" y="95" width="180" height="35" rx="6" fill="#f59e0b"/>
  <text x="55" y="118" fill="#0b1120" font-family="sans-serif" font-size="13" font-weight="700">1. Packet Dissector</text>

  <rect x="230" y="95" width="220" height="35" rx="6" fill="#0f172a"/>
  <text x="245" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">2. PV &amp; Command Studio</text>

  <rect x="460" y="95" width="190" height="35" rx="6" fill="#0f172a"/>
  <text x="475" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">3. Session Manager</text>

  <rect x="660" y="95" width="220" height="35" rx="6" fill="#0f172a"/>
  <text x="675" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">4. IEC 62443 &amp; NE107</text>

  <rect x="890" y="95" width="200" height="35" rx="6" fill="#0f172a"/>
  <text x="905" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">5. Process Firewall</text>

  <!-- Left Column: Controls Card -->
  <rect x="30" y="150" width="550" height="510" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="55" y="185" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">HART-IP Protocol Configuration &amp; PDU Frame</text>

  <!-- Form Fields -->
  <rect x="55" y="210" width="240" height="40" rx="6" fill="#050811" stroke="#334155"/>
  <text x="65" y="235" fill="#64748b" font-family="sans-serif" font-size="12">Command: <tspan fill="#f59e0b" font-weight="600">Cmd 1 (Read PV)</tspan></text>

  <rect x="315" y="210" width="240" height="40" rx="6" fill="#050811" stroke="#334155"/>
  <text x="325" y="235" fill="#64748b" font-family="sans-serif" font-size="12">Addressing: <tspan fill="#06b6d4" font-weight="600">Long Frame (5-Byte ID)</tspan></text>

  <rect x="55" y="265" width="240" height="40" rx="6" fill="#050811" stroke="#334155"/>
  <text x="65" y="290" fill="#64748b" font-family="sans-serif" font-size="12">Transmitter: <tspan fill="#f8fafc" font-weight="600">Emerson / Rosemount (0x16)</tspan></text>

  <rect x="315" y="265" width="240" height="40" rx="6" fill="#050811" stroke="#334155"/>
  <text x="325" y="290" fill="#64748b" font-family="sans-serif" font-size="12">Simulated PV: <tspan fill="#10b981" font-weight="600">101.325 kPa</tspan></text>

  <!-- Checksum Callout -->
  <rect x="55" y="325" width="500" height="50" rx="6" fill="#080d14" stroke="#f59e0b" stroke-width="1"/>
  <text x="70" y="347" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="600">Longitudinal Redundancy Check (LRC XOR Formula):</text>
  <text x="70" y="365" fill="#cbd5e1" font-family="monospace" font-size="12">LRC = Delimiter ^ Addr[0..4] ^ Cmd ^ ByteCount ^ Data[0..n] (Result: 0xE8)</text>

  <!-- Hex Stream Box -->
  <rect x="55" y="395" width="500" height="150" rx="6" fill="#03060c" stroke="#1e293b"/>
  <text x="70" y="420" fill="#64748b" font-family="monospace" font-size="12">// Raw HART-IP Response Frame (24 Bytes):</text>
  <text x="70" y="445" fill="#fbbf24" font-family="monospace" font-size="13">01 01 03 00 00 02 00 18 86 96 24 12 34 56 01 07</text>
  <text x="70" y="470" fill="#fbbf24" font-family="monospace" font-size="13">00 00 20 41 cb 33 33 e8</text>
  <text x="70" y="505" fill="#10b981" font-family="monospace" font-size="12">✓ HART-IP v1 (24B) | PDU: Long Slave Resp | PV: 101.325 kPa | LRC: 0xE8 Valid</text>

  <!-- Action Buttons -->
  <rect x="55" y="570" width="235" height="42" rx="6" fill="url(#accentGrad)"/>
  <text x="105" y="596" fill="#0b1120" font-family="sans-serif" font-size="13" font-weight="700">SYNTHESIZE HART FRAME</text>

  <rect x="310" y="570" width="245" height="42" rx="6" fill="#334155"/>
  <text x="350" y="596" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">EXPORT TO PCAP (5094)</text>

  <!-- Right Column: Dissection & Audit Summary -->
  <rect x="610" y="150" width="560" height="510" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="635" y="185" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Real-Time Wire Dissection &amp; Compliance Card</text>

  <!-- Decoded Layers Tree -->
  <rect x="635" y="210" width="510" height="85" rx="6" fill="#03060c" stroke="#1e293b"/>
  <text x="650" y="235" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">HART-IP Layer (IEC 62591 / UDP Port 5094)</text>
  <text x="650" y="255" fill="#94a3b8" font-family="sans-serif" font-size="12">Version: 1 | MsgType: Response (0x01) | MsgId: Token-Passing PDU (0x03)</text>
  <text x="650" y="275" fill="#94a3b8" font-family="sans-serif" font-size="12">Status: Success (0x00) | Sequence: 2 | Total Length: 24 Bytes</text>

  <rect x="635" y="310" width="510" height="115" rx="6" fill="#03060c" stroke="#1e293b"/>
  <text x="650" y="335" fill="#06b6d4" font-family="sans-serif" font-size="13" font-weight="700">HART Token-Passing PDU Layer</text>
  <text x="650" y="355" fill="#94a3b8" font-family="sans-serif" font-size="12">Delimiter: 0x86 (Long Slave Response) | Command: Cmd 1 (Read PV)</text>
  <text x="650" y="375" fill="#94a3b8" font-family="sans-serif" font-size="12">Address: Emerson / Rosemount (DevType 0x24, ID: 1193046)</text>
  <text x="650" y="398" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">Primary Variable: 101.325 kPa (IEEE 754 Float)</text>

  <!-- Security Audit Card -->
  <rect x="635" y="440" width="510" height="200" rx="6" fill="#050811" stroke="#334155"/>
  <text x="650" y="465" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">IEC 62443 &amp; NAMUR NE107 Posture</text>
  <rect x="1040" y="450" width="90" height="24" rx="4" fill="#10b981"/>
  <text x="1055" y="467" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">SCORE: 82%</text>

  <text x="650" y="495" fill="#10b981" font-family="sans-serif" font-size="12">✓ HART-SEC-03: Transmitter Write-Protect Switch Locked ON (Pass)</text>
  <text x="650" y="520" fill="#10b981" font-family="sans-serif" font-size="12">✓ HART-SEC-06: NAMUR NE107 Alarming &amp; Cmd 48 Polling Active (Pass)</text>
  <text x="650" y="545" fill="#ef4444" font-family="sans-serif" font-size="12">✗ HART-SEC-01: Cleartext HART-IP over Port 5094 (Migrate to HART-IP v2 DTLS)</text>
  <text x="650" y="570" fill="#ef4444" font-family="sans-serif" font-size="12">✗ HART-SEC-02: Unauthenticated Span Calibration Writes (Cmd 35 / 45)</text>
  <text x="650" y="605" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="600">Conduit Defense: 2 nftables rules &amp; 4 Suricata signatures generated</text>
</svg>