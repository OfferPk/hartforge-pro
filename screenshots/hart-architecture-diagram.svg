<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="650" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="50" y="55" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">HARTForge Pro — Architecture &amp; Process Protocol Stack</text>
  <text x="50" y="80" fill="#94a3b8" font-family="sans-serif" font-size="14">IEC 62591 (HART-IP), WirelessHART, NAMUR NE107, &amp; IEC 62443 Process Security</text>

  <!-- Protocol Layer Stack -->
  <rect x="50" y="110" width="480" height="490" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="145" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">HART-IP (Port 5094) Protocol Encapsulation</text>

  <!-- Layer 7b -->
  <rect x="75" y="165" width="430" height="85" rx="6" fill="#b45309" stroke="#f59e0b"/>
  <text x="90" y="190" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 7b: HART Token-Passing PDU (Application)</text>
  <text x="90" y="210" fill="#fef3c7" font-family="sans-serif" font-size="12">Delim | 5-Byte Long Addr (Mfg, DevType, DevID) | Cmd | Data | LRC</text>
  <text x="90" y="230" fill="#fef3c7" font-family="sans-serif" font-size="12">Commands: Cmd 0 (ID), Cmd 1 (PV), Cmd 3 (Vars), Cmd 48 (NE107)</text>

  <!-- Layer 7a -->
  <rect x="75" y="260" width="430" height="70" rx="6" fill="#0369a1" stroke="#0ea5e9"/>
  <text x="90" y="285" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 7a: HART-IP Protocol Header (8 Bytes)</text>
  <text x="90" y="305" fill="#bae6fd" font-family="sans-serif" font-size="12">Version (0x01/0x02) | MsgType | MsgID | Status | Sequence | Byte Count</text>
  <text x="90" y="322" fill="#bae6fd" font-family="sans-serif" font-size="12">Services: Session Init (0x00), Token-Passing (0x03), Keep-Alive (0x02)</text>

  <!-- Layer 4 -->
  <rect x="75" y="340" width="430" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="90" y="365" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 4: UDP &amp; TCP Transport (Port 5094)</text>
  <text x="90" y="385" fill="#cbd5e1" font-family="sans-serif" font-size="12">UDP: Fast Cyclic Process Telemetry | TCP: Management &amp; Diagnostics</text>

  <!-- Layer 3 -->
  <rect x="75" y="415" width="430" height="50" rx="6" fill="#0b1329"/>
  <text x="90" y="445" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">Layer 3: IP (Industrial Process Automation Subnet)</text>

  <!-- Physical -->
  <rect x="75" y="475" width="430" height="50" rx="6" fill="#020617"/>
  <text x="90" y="505" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="600">Layer 2/1: Ethernet / 802.11 / WirelessHART (802.15.4 Mesh)</text>

  <!-- HARTForge Pro Engine Components -->
  <rect x="560" y="110" width="490" height="490" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="585" y="145" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">HARTForge Pro Engine Modules</text>

  <rect x="585" y="165" width="440" height="70" rx="6" fill="#050811" stroke="#f59e0b"/>
  <text x="600" y="190" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">HARTProtocolEngine (JS &amp; Python CLI)</text>
  <text x="600" y="210" fill="#94a3b8" font-family="sans-serif" font-size="12">• HART-IP Header + Token-Passing PDU codec &amp; LRC XOR engine</text>
  <text x="600" y="226" fill="#94a3b8" font-family="sans-serif" font-size="12">• Wire Dissector, IEEE 754 Float decoder, Libpcap 2.4 exporter</text>

  <rect x="585" y="245" width="440" height="70" rx="6" fill="#050811" stroke="#f59e0b"/>
  <text x="600" y="270" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">HARTSecurityAuditor (IEC 62443 &amp; NE107)</text>
  <text x="600" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">• 10-point audit matrix (Cleartext 5094, write jumpers, join keys)</text>
  <text x="600" y="306" fill="#94a3b8" font-family="sans-serif" font-size="12">• Posture scoring, calibration tamper risks, remediation guides</text>

  <rect x="585" y="325" width="440" height="70" rx="6" fill="#050811" stroke="#f59e0b"/>
  <text x="600" y="350" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">HARTConfigSynthesizer (Process Firewall)</text>
  <text x="600" y="370" fill="#94a3b8" font-family="sans-serif" font-size="12">• Linux nftables process conduit ruleset generator</text>
  <text x="600" y="386" fill="#94a3b8" font-family="sans-serif" font-size="12">• Suricata L7 signatures for Cmd 35 (Re-span) &amp; Cmd 45 (DAC trim)</text>

  <rect x="585" y="405" width="440" height="75" rx="6" fill="#050811" stroke="#334155"/>
  <text x="600" y="430" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Universal Delivery Formats</text>
  <text x="600" y="450" fill="#94a3b8" font-family="sans-serif" font-size="12">• Zero-dependency HTML5 Web Studio (offline air-gap ready)</text>
  <text x="600" y="468" fill="#94a3b8" font-family="sans-serif" font-size="12">• Standalone Python 3 CLI (`hartforge-cli.py`, executable)</text>

  <!-- Bottom Badge -->
  <rect x="585" y="495" width="440" height="80" rx="6" fill="#080d14" stroke="#10b981"/>
  <text x="600" y="525" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700">✓ Target Field Instruments Supported:</text>
  <text x="600" y="545" fill="#f8fafc" font-family="sans-serif" font-size="12">Emerson / Rosemount, Endress+Hauser, Yokogawa, Siemens, Honeywell, ABB</text>
  <text x="600" y="563" fill="#94a3b8" font-family="sans-serif" font-size="11">Pressure, Flow, Temperature, Level, Valve Positioners (Port 5094)</text>
</svg>